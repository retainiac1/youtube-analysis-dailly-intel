<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>daily-intel dashboard</title>

  <!-- Apply the persisted theme before paint so there is no flash. Defaults to
       dark (the design baseline). -->
  <script>
    (function () {
      var saved = localStorage.getItem('site-theme');
      document.documentElement.setAttribute('data-theme', saved || 'dark');
    })();
  </script>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="https://api.fontshare.com/v2/css?f[]=satoshi@400,500,700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="/css/tokens.css">
  <link rel="stylesheet" href="/css/dashboard.css">
</head>
<body>
  <div id="app" data-lane="health">
    <!-- Pinned strip: stays at the top of the viewport while the board/charts
         scroll underneath. Height is measured at runtime into --header-h (see
         js/sticky-header.js); the rail offset and scroll-padding read that var so
         there is no hardcoded header height anywhere. -->
    <div class="sticky-header">
      <!-- Top tier: global page nav (left, with the title) + run picker and theme
           toggle (right). The Board/Trends links drive the client router, so they
           are real links (aria-current marks the page), not an in-page toggle. -->
      <header class="topbar">
        <div class="topbar-left">
          <h1 class="heading-xl app-title">daily-intel</h1>
          <nav class="page-nav" aria-label="Pages">
            <a class="page-nav-link" data-route href="/board" id="nav-board"
               aria-current="page" tabindex="0">Board</a>
            <a class="page-nav-link" data-route href="/trends" id="nav-trends"
               tabindex="-1">Trends</a>
            <a class="page-nav-link" data-route href="/interpretation"
               id="nav-interpretation" tabindex="-1">Interpretation</a>
          </nav>
        </div>
        <div class="topbar-controls">
          <label class="run-picker">
            <span class="control-label">Run</span>
            <select id="run-select" aria-label="Run date"></select>
          </label>
          <button id="theme-toggle" class="btn-secondary icon-btn" type="button"
                  aria-label="Toggle light and dark theme">◐</button>
        </div>
      </header>

      <!-- Second tier: content scope. The lane tabs stay a tablist (they narrow
           the data within whichever page is shown) and persist across pages. -->
      <div class="lane-row">
        <nav class="lane-tabs" role="tablist" aria-label="Lane">
          <button class="lane-tab" role="tab" data-lane="health" id="tab-health"
                  aria-selected="true" tabindex="0">Health</button>
          <button class="lane-tab" role="tab" data-lane="habit" id="tab-habit"
                  aria-selected="false" tabindex="-1">Habit</button>
          <button class="lane-tab" role="tab" data-lane="overall" id="tab-overall"
                  aria-selected="false" tabindex="-1">Overall</button>
        </nav>
      </div>

      <button id="filter-drawer-toggle" class="btn-secondary filter-drawer-toggle"
              type="button" aria-controls="filter-rail" aria-expanded="false">
        Filters
      </button>
    </div>

    <div class="layout">
      <aside id="filter-rail" class="glass-panel filter-rail" aria-label="Filters">
        <div class="filter-rail-head">
          <h2 class="heading-sm">Filters</h2>
          <button id="clear-filters" class="btn-link" type="button">Clear all</button>
        </div>
        <div id="filter-groups"></div>
      </aside>

      <main class="board" id="board" aria-live="polite"></main>

      <main class="trends" id="trends" aria-live="polite" hidden>
        <section class="glass-panel chart-card">
          <h2 class="heading-sm">Rank movement across runs</h2>
          <div id="chart-bump" class="chart-mount"></div>
        </section>
        <section class="glass-panel chart-card">
          <h2 class="heading-sm">View-count distribution (this run)</h2>
          <div id="chart-distribution" class="chart-mount"></div>
        </section>
        <section class="glass-panel chart-card">
          <h2 class="heading-sm">Tracked video trajectory</h2>
          <div id="chart-trajectory" class="chart-mount"></div>
        </section>
      </main>

      <main class="interpretation" id="interpretation" aria-live="polite" hidden></main>
    </div>
  </div>

  <!-- Vendored offline; pinned to ECharts 5.5.1. Loaded before the ES module so
       the `echarts` global exists when charts.js runs. -->
  <script src="/vendor/echarts-5.5.1.min.js"></script>
  <script type="module" src="/js/main.js"></script>
</body>
</html>
