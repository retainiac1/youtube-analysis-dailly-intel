<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>daily-intel dashboard</title>

  <!-- Apply the persisted theme before paint so there is no flash. Defaults to
       dark (the design baseline). -->
  <script>
    (function () {
      var saved = localStorage.getItem('site-theme');
      document.documentElement.setAttribute('data-theme', saved || 'dark');
    })();
  </script>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="https://api.fontshare.com/v2/css?f[]=satoshi@400,500,700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="/css/tokens.css">
  <link rel="stylesheet" href="/css/dashboard.css">
</head>
<body>
  <div id="app" data-lane="health">
    <!-- Pinned strip: stays at the top of the viewport while the board/charts
         scroll underneath. Height is measured at runtime into --header-h (see
         js/sticky-header.js); the rail offset and scroll-padding read that var so
         there is no hardcoded header height anywhere. -->
    <div class="sticky-header">
      <!-- Top tier: global page nav (left, with the title) + run picker and theme
           toggle (right). The Board/Trends links drive the client router, so they
           are real links (aria-current marks the page), not an in-page toggle. -->
      <header class="topbar">
        <div class="topbar-left">
          <h1 class="heading-xl app-title">daily-intel</h1>
          <nav class="page-nav" aria-label="Pages">
            <a class="page-nav-link" data-route href="/board" id="nav-board"
               aria-current="page" tabindex="0">Board</a>
            <a class="page-nav-link" data-route href="/trends" id="nav-trends"
               tabindex="-1">Trends</a>
            <a class="page-nav-link" data-route href="/interpretation"
               id="nav-interpretation" tabindex="-1">Interpretation</a>
            <a class="page-nav-link" data-route href="/dashboard"
               id="nav-dashboard" tabindex="-1">Dashboard</a>
            <a class="page-nav-link" data-route href="/extract"
               id="nav-extract" tabindex="-1">Extract</a>
            <a class="page-nav-link" data-route href="/models"
               id="nav-models" tabindex="-1">Models</a>
            <a class="page-nav-link" data-route href="/prices"
               id="nav-prices" tabindex="-1">Prices</a>
            <a class="page-nav-link" data-route href="/documentation"
               id="nav-documentation" tabindex="-1">Documentation</a>
          </nav>
        </div>
        <div class="topbar-controls">
          <button id="theme-toggle" class="btn-secondary icon-btn" type="button"
                  aria-label="Toggle light and dark theme">◐</button>
        </div>
      </header>

      <!-- Second tier: one content-scope row. Lane tabs (left) narrow the data within
           whichever page is shown and persist across pages; the date filter (right, via
           justify-content: space-between) scopes by date. main.js toggles each child's
           visibility per page; .date-filter-control[hidden] / .lane-row[hidden] collapse
           them. The theme toggle stays independent in .topbar-controls. -->
      <div class="lane-row">
        <nav class="lane-tabs" role="tablist" aria-label="Lane">
          <button class="lane-tab" role="tab" data-lane="health" id="tab-health"
                  aria-selected="true" tabindex="0">Health</button>
          <button class="lane-tab" role="tab" data-lane="habit" id="tab-habit"
                  aria-selected="false" tabindex="-1">Habit</button>
          <button class="lane-tab" role="tab" data-lane="overall" id="tab-overall"
                  aria-selected="false" tabindex="-1">Overall</button>
        </nav>
        <div class="date-filter-control" id="date-filter-control">
          <div class="date-mode-tabs" role="tablist" aria-label="Date filter mode">
            <button class="date-mode-tab" type="button" role="tab"
                    id="dfc-mode-period" data-mode="period"
                    aria-selected="true" tabindex="0">Period</button>
            <button class="date-mode-tab" type="button" role="tab"
                    id="dfc-mode-specific" data-mode="specific"
                    aria-selected="false" tabindex="-1">Specific date</button>
          </div>
          <select id="dfc-period" aria-label="Time period"></select>
          <select id="dfc-run" aria-label="Run date" hidden></select>
        </div>
      </div>

      <button id="filter-drawer-toggle" class="btn-secondary filter-drawer-toggle"
              type="button" aria-controls="filter-rail" aria-expanded="false">
        Filters
      </button>
    </div>

    <div class="layout">
      <aside id="filter-rail" class="glass-panel filter-rail" aria-label="Filters">
        <div class="filter-rail-head">
          <h2 class="heading-sm">Filters</h2>
          <button id="clear-filters" class="btn-link" type="button">Clear all</button>
        </div>
        <div id="filter-groups"></div>
      </aside>

      <main class="board" id="board" aria-live="polite"></main>

      <main class="trends" id="trends" aria-live="polite" hidden>
        <div class="trends-charts">
          <section class="glass-panel chart-card">
            <h2 class="heading-sm">Rank movement across runs</h2>
            <div id="chart-bump" class="chart-mount"></div>
          </section>
          <section class="glass-panel chart-card">
            <h2 class="heading-sm">Tracked video trajectory</h2>
            <div id="chart-trajectory" class="chart-mount"></div>
          </section>
        </div>
        <!-- Read-only interpretation rail: the stored summary for the current run
             and lane, shown beside the evidence. Display only (no controls, no run
             button, no write path); its content is rendered by interpretation-rail.js
             and the "Tune" link routes to /interpretation for generation. -->
        <aside class="glass-panel interpretation-rail" id="trends-interp-rail"
               aria-label="Interpretation"></aside>
      </main>

      <!-- Two stable mounts on the shared .page-aside shell: interpretation.js owns
           #interpretation-main (it calls replaceChildren on it), and a spend.js panel
           instance owns the #spend-panel aside beside it. Keeping them as separate
           children means a generation re-render never wipes the spend panel. -->
      <main class="interpretation page-aside" id="interpretation" aria-live="polite" hidden>
        <div id="interpretation-main" class="page-aside-main"></div>
        <aside class="glass-panel spend-panel" id="spend-panel" aria-label="LLM spend"></aside>
      </main>

      <!-- The Dashboard page: lane-scoped, period-aggregated charts across four sub-tabs
           (Topic mix, Breakout, Format & craft, Lifecycle). dashboard.js owns this region:
           it renders the sub-tab nav once and swaps only the section panel. Lane + date
           scoped, like Trends. -->
      <main class="dashboard" id="dashboard" aria-live="polite" hidden></main>

      <!-- The Extract page on the shared .page-aside shell: extract.js owns #extract-main
           (it replaceChildren's it) with the run controls + the streamed terminal; a
           spend.js panel will own the #extract-spend-panel aside (Phase 5). Mounting the
           aside as a sibling of #extract-main (not a child) means a run re-render never
           wipes it. A global action surface, not run/lane scoped. No page-level aria-live:
           the terminal carries its own, so only run output announces (not the whole page on
           every navigation). -->
      <main class="extract page-aside" id="extract" hidden>
        <div id="extract-main" class="page-aside-main"></div>
        <aside class="glass-panel spend-panel" id="extract-spend-panel" aria-label="LLM spend"></aside>
      </main>

      <!-- The model + price registry editor (models.js owns this region; it
           replaceChildren's it). A global admin surface, not run/lane scoped. -->
      <main class="models" id="models" aria-live="polite" hidden></main>

      <!-- The price-refresh agent on the shared .page-aside shell. price-refresh.js owns
           #prices-main (it replaceChildren's it): prices + day-over-day deltas, the
           pending proposals review, a model dropdown, and a Run button. A spend.js panel
           instance owns the #prices-spend-panel aside beside it; mounting it as a sibling
           of #prices-main (not a child) means a price-refresh re-render never wipes it.
           A global admin surface, not run/lane scoped. -->
      <main class="prices page-aside" id="prices" aria-live="polite" hidden>
        <div id="prices-main" class="page-aside-main"></div>
        <aside class="glass-panel spend-panel" id="prices-spend-panel" aria-label="LLM spend"></aside>
      </main>

      <!-- Documentation: a filesystem-discovered docs browser (documentation.js owns
           this region; it replaceChildren's it). Read-only, not run/lane scoped. -->
      <main class="documentation" id="documentation" aria-live="polite" hidden></main>
    </div>
  </div>

  <!-- Vendored offline; pinned. Loaded before the ES module so their globals
       (echarts, marked, DOMPurify, JSZip, docx, pdfjsLib) exist when the modules run.
       marked + DOMPurify back the Documentation page's markdown/html reading adapters;
       JSZip + docx-preview back its docx native adapter (JSZip first: docx-preview reads
       the global JSZip); pdf.js backs its pdf native adapter. The pdf worker is NOT a
       script tag: pdf.js loads it itself from the path set in GlobalWorkerOptions.workerSrc
       (see doc-adapters.js). -->
  <script src="/vendor/echarts-5.5.1.min.js"></script>
  <script src="/vendor/marked-12.0.2.min.js"></script>
  <script src="/vendor/dompurify-3.1.7.min.js"></script>
  <script src="/vendor/jszip-3.10.1.min.js"></script>
  <script src="/vendor/docx-preview-0.3.7.min.js"></script>
  <script src="/vendor/pdf-3.11.174.min.js"></script>
  <script type="module" src="/js/main.js"></script>
</body>
</html>
