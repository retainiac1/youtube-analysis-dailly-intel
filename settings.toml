# Display-time cost map for LLM interpretation runs, keyed by the canonical
# "provider:model" string. Values are est. USD per 1M tokens (verified 2026-06-09;
# these drift — they are estimates, not billed amounts). Keys MUST be quoted: they
# contain ':' and '.', both of which break a bare TOML key.
[prices]
"anthropic:claude-haiku-4-5"   = { input = 1.00, output = 5.00 }
"openai:gpt-5.4-nano"          = { input = 0.20, output = 1.25 }
"xai:grok-4-fast"              = { input = 0.20, output = 0.50 }
"google:gemini-2.5-flash-lite" = { input = 0.10, output = 0.40 }

# Palette, thresholds, and donut radii for the dashboard's LLM-spend visual (the
# spend-share donut + token/cost leaderboard). None of these are hardcoded in JS or
# CSS; they are served to the frontend with the /api/spend payload. Bar mapping is
# fixed: tokens = blue, dollars = green. The badge palette is a SINGLE GREEN RAMP by
# efficiency (NOT a red/green stoplight): efficient (low $/M) = deepest green,
# expensive (high $/M) = brightest green, mid in between.
#
# The section name is the UPPERCASE key the loader looks up (config.load_settings
# does parsed.get("SPEND_VIZ")); a lowercase or dotted name would silently fall back
# to the in-code DEFAULT_SPEND_VIZ instead of applying these edits.
[SPEND_VIZ]
token_bar_color    = "#2D7CFF"   # tokens: the brand blue (--accent-blue)
cost_bar_color     = "#00F2A9"   # cost: the brand mint (--accent-cyan)
# A mint ramp, BRIGHTEST first. Slice i (by share, largest first) gets color i, so the
# biggest slice is the most saturated/visible -- the opposite of burying it in a dark
# tone. Stops stay distinguishable and dim toward a muted teal-gray for tail models.
donut_slice_colors = ["#00F2A9", "#22D3A4", "#3BB89B", "#4A9C8E", "#527F7E", "#55636B"]
donut_inner_radius = "58%"       # ring hole (sized to clear the centered total)
donut_outer_radius = "80%"
efficiency_good    = 0.50        # $/M at or below -> "good" badge (deepest green)
efficiency_warn    = 1.00        # $/M at or above -> "warn" badge (brightest green)
good_bg = "#14532D"   # <= efficiency_good: deep green fill
good_fg = "#D1FAE5"   # pale mint text on deep green
mid_bg  = "#15803D"   # between cutoffs: mid green fill
mid_fg  = "#ECFDF5"   # near-white text on mid green
warn_bg = "#4ADE80"   # >= efficiency_warn: bright green fill
warn_fg = "#052E16"   # very dark green text on bright green
