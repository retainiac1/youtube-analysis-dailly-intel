# User-tunable knobs for the daily-intel pipeline. Hand-editable and validated at
# startup (see config.py). The values here are a behavior-preserving extraction of
# the former config.py constants — changing one RETUNES the pipeline, so edit with
# intent. A missing file or missing key falls back to the in-code defaults.

MIN_VIEWS = 10000                  # qualifying-view floor; positive int. ~10k fills the lanes (~15-20 each), 100k leaves them near-empty.
WINDOW_DAYS = 3                    # discovery lookback in days; positive int (1-7 is the sane range).
TOP_N = 20                         # ranked rows kept per lane; positive int.
SHORT_MAX_SECONDS = 180            # Shorts duration cutoff in seconds; positive int. Videos <= this are treated as Shorts.
SEARCH_RELEVANCE_LANGUAGE = "en"   # YouTube relevanceLanguage hint; ISO-639-1 string (e.g. "en", "es").
DAILY_QUOTA_LIMIT = 10000          # YouTube Data API daily quota units; positive int (Google grants 10000 by default).
SAFETY_BUFFER = 500                # units held back below the limit; positive int, MUST be < DAILY_QUOTA_LIMIT.
CATEGORY_REGION = "US"             # ISO-3166 region whose titles seed the categories table; non-empty string. IDs are global, so any English region matches.
OLLAMA_BASE_URL = "http://127.0.0.1:11434"  # local Ollama HTTP endpoint the adapter calls; non-empty string. Loopback only (never 0.0.0.0).
OLLAMA_TIMEOUT_SECONDS = 300       # per-request timeout for the Ollama call; positive int. 5-min fail-fast ceiling so a dead/grinding server fails clean instead of hanging ~10 min. Raise for genuinely slower local models.

# Per-model LLM output-token caps (the models.max_tokens column defaults). These
# three have NO in-code fallback: config.py loads them strictly and ConfigError-s
# if the file/key is missing, because a silently-defaulted token cap is an invisible
# cost surprise. A cloud row stores one of the two defaults; a local row stores NULL
# (uncapped). max_tokens bounds total billed output INCLUDING reasoning tokens.
DEFAULT_MAX_TOKENS = 512            # factory default for a NON-reasoning cloud model; positive int, <= MAX_TOKENS_UPPER_BOUND. 512 fits a 3-4 sentence summary.
DEFAULT_MAX_TOKENS_REASONING = 5000 # factory default for a REASONING cloud model; positive int, <= MAX_TOKENS_UPPER_BOUND. Generous so thinking tokens don't starve the answer.
MAX_TOKENS_UPPER_BOUND = 8192      # typo-guard ceiling for an edited max_tokens; positive int. Deliberately ABOVE the reasoning default so a reasoning model has headroom to be tuned up without a config edit. The provider enforces its own real ceiling.

